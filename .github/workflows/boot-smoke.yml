name: Bootable kernel smoke test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boot:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libc6-dev cpio qemu-system-x86 linux-image-generic
      - name: Build kernel + initramfs
        run: |
          KERNEL_IMAGE="$(find /boot -maxdepth 1 -name 'vmlinuz-*' | sort -V | tail -1)"
          test -n "$KERNEL_IMAGE"
          sudo env KERNEL_IMAGE="$KERNEL_IMAGE" bash tools/build-bootable-prototype.sh
          sudo chown -R "$USER:$USER" build/bootable
      - name: Boot QEMU and verify PID 1
        run: |
          set +e
          timeout 120s qemu-system-x86_64 -m 512M -nographic -no-reboot \
            -kernel build/bootable/vmlinuz \
            -initrd build/bootable/initramfs.cpio.gz \
            -append 'console=ttyS0 rdinit=/init panic=1' > boot.log 2>&1
          rc=$?
          set -e
          tail -100 boot.log
          grep -q 'INTENTOS_BOOT_OK' boot.log || { echo "Boot marker missing; QEMU exit: $rc"; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: intentos-bootable-x86_64
          path: |
            build/bootable/vmlinuz
            build/bootable/initramfs.cpio.gz
            boot.log
          if-no-files-found: warn
